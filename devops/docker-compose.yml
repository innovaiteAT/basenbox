services:
  backend:
    build:
      context: ../backend
      dockerfile: ../devops/docker/backend.Dockerfile
    environment:
      - PORT=3000
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: devops/docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
