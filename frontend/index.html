<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basenbox</title>
</head>
<body>
  <h1>Basenbox</h1>
  <p id="msg">Lade...</p>
  <script>
    fetch("/api/hello")
      .then(r => r.json())
      .then(d => document.getElementById("msg").textContent = d.message)
      .catch(() => document.getElementById("msg").textContent = "Backend nicht erreichbar");
  </script>
</body>
</html>
